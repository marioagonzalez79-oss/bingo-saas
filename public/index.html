<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Royale - Inicio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1b1035 0%, #090514 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: rgba(25, 18, 48, 0.85);
            border: 1px solid rgba(234, 179, 8, 0.3);
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            max-width: 450px;
            width: 90%;
        }
        h1 { font-size: 36px; margin-bottom: 10px; color: #facc15; }
        p { color: #cbd5e1; font-size: 16px; margin-bottom: 35px; }
        .btn-player {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            text-transform: uppercase;
        }
        .admin-links {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 12px;
        }
        .admin-link {
            color: #64748b;
            cursor: pointer;
            text-decoration: none;
        }
        .admin-link:hover { color: #94a3b8; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BINGO ROYALE</h1>
        <p>Compra tus cartones y sigue el bolillero en tiempo real.</p>
        
        <a href="player.html" class="btn-player">🎲 ¡Entrar a Jugar!</a>
        
        <div class="admin-links">
            <span class="admin-link" onclick="accesoSuperAdmin()">Área Super Admin</span>
            <span class="admin-link" onclick="accesoClub()">Acceso Clubes</span>
        </div>
    </div>

    <script>
        function accesoSuperAdmin() {
            const clave = prompt("Introduce la clave de Super Admin:");
            if (clave === "bingo2026seguro") {
                sessionStorage.setItem('admin_auth', 'true');
                window.location.href = "admin-panel.html";
            } else if (clave !== null) {
                alert("Clave incorrecta.");
            }
        }

        function accesoClub() {
            const clave = prompt("Introduce la clave de Organizador / Club:");
            // Contraseña independiente para los clubes
            if (clave === "clubes2026access") {
                sessionStorage.setItem('club_auth', 'true');
                window.location.href = "org-admin.html";
            } else if (clave !== null) {
                alert("Clave incorrecta.");
            }
        }
    </script>
</body>
</html>
