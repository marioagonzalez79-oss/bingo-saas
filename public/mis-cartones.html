<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Cartones</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-6">
    <div class="max-w-2xl mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-indigo-400">Portal de Comprador</h1>
        <div class="bg-slate-800 p-6 rounded-xl flex gap-3">
            <input type="email" id="buyerEmail" placeholder="Ingresa tu email registrado" class="flex-grow bg-slate-900 p-2 rounded border border-slate-700">
            <button onclick="buscarMisCartones()" class="bg-indigo-600 px-4 py-2 rounded">Buscar</button>
        </div>
        <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script>
        async function buscarMisCartones() {
            const email = document.getElementById('buyerEmail').value;
            // Necesitamos un endpoint que busque por email
            const res = await fetch(`/api/cards/by-email/${email}`);
            const data = await res.json();
            const container = document.getElementById('results');
            container.innerHTML = '';
            
            data.cards.forEach(c => {
                container.innerHTML += `
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                        <p class="text-xs text-slate-400">Cartón #${c.card_number}</p>
                        <p class="font-mono text-lg">${c.card_data.numbers.slice(0,5).join(', ')}...</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
