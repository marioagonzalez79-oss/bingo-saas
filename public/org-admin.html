<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Organización - Bingo SaaS</title>
    <style>
        :root {
            --bg-main: #0f172a; --bg-card: #1e293b; --border-color: #334155;
            --primary: #4f46e5; --primary-hover: #4338ca; --accent: #34d399;
            --danger: #ef4444; --text-main: #f8fafc; --text-muted: #94a3b8;
            --pending: #fbbf24; --purple: #7c3aed; --blue: #0284c7;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 24px; }
        .max-w { max-width: 1000px; margin: 0 auto; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
        h1 { color: var(--accent); margin-top: 0; font-size: 24px; }
        label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px; }
        input, textarea { background-color: #0b0f19; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        button { background-color: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-emerald { background-color: #059669; }
        .btn-danger { background-color: var(--danger); }
        .btn-purple { background-color: var(--purple); }
        .btn-blue { background-color: var(--blue); }
        .cards-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; background: #0b0f19; display: none; }
        .cards-table th, .cards-table td { padding: 10px; border: 1px solid #334155; text-align: left; }
        .ball-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 10px; }
        .ball { width: 28px; height: 28px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 11px; }
        .ball.called { background: #059669; }
        .winner-alert { background: #7f1d1d; border: 2px solid #ef4444; color: #fee2e2; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
    <script>
    const clubAutorizado = sessionStorage.getItem('club_auth');
    if (clubAutorizado !== 'true') {
        const clave = prompt("Área restringida para Clubes. Introduce la clave de acceso:");
        if (clave === "clubes2026access") {
            sessionStorage.setItem('club_auth', 'true');
        } else {
            alert("Acceso no autorizado.");
            window.location.href = "index.html";
        }
    }
    </script>
</head>
<body>
    <div class="max-w">
        <a href="/player.html" style="float:right; color:var(--text-muted);">Portal Jugador →</a>
        <h1>🏟️ Panel de Organización</h1>
        
        <div class="card">
            <h2>🏢 Acceso</h2>
            <div style="display: flex; gap: 10px;">
                <input type="email" id="emailInput" placeholder="Correo de la organización">
                <button onclick="ingresarPorCorreo()" class="btn-emerald">Cargar Panel</button>
            </div>
        </div>

        <div id="orgDashboard" style="display:none;">
            <div id="eventsContainer"></div>
        </div>
    </div>

    <script>
        let sortenosAutomaticos = {};
        let intervaloMonitoreo = null;
        window.currentOrgId = "";

        async function ingresarPorCorreo() {
            const email = document.getElementById('emailInput').value.trim().toLowerCase();
            if (!email) return;
            const res = await fetch(`/api/organizations/email/${encodeURIComponent(email)}`);
            const data = await res.json();
            if (!res.ok) return alert(data.error);
            window.currentOrgId = data.organization.id;
            document.getElementById('orgDashboard').style.display = 'block';
            await renderizarEventos(data.events);

            // Iniciar monitoreo automático cada 4 segundos para refrescar estado y detectar ganadores sin tocar inputs
            if (!intervaloMonitoreo) {
                intervaloMonitoreo = setInterval(() => refrescarDatosEventos(email), 4000);
            }
        }

        async function refrescarDatosEventos(email) {
            try {
                const res = await fetch(`/api/organizations/email/${encodeURIComponent(email)}`);
                const data = await res.json();
                if (res.ok) {
                    await renderizarEventos(data.events, true); // true para mantener campos y foco si es posible
                }
            } catch(e) {}
        }

        async function venderCartonManual(eventId) {
            const num = document.getElementById(`manCard_${eventId}`).value;
            const cardRes = await fetch(`/api/events/${eventId}/cards`);
            const cardData = await cardRes.json();
            const card = cardData.cards.find(c => c.card_number == num);
            
            if(!card) return alert("Cartón no encontrado");
            
            await fetch('/api/cards/buy', { method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    card_id: card.id,
                    buyer_name: document.getElementById(`manName_${eventId}`).value,
                    buyer_email: document.getElementById(`manEmail_${eventId}`).value,
                    buyer_dni: document.getElementById(`manDni_${eventId}`).value,
                    buyer_alias: document.getElementById(`manAlias_${eventId}`).value,
                    payment_proof: 'VENTA_MANUAL'
                })
            });
            await fetch(`/api/events/validate-payment/${card.id}`, { method: 'PUT' });
            alert("Venta registrada y validada");
            ingresarPorCorreo();
        }

        async function cantarBolillaManual(eventId) {
            const numStr = prompt("Ingresa el número de la bolilla (1 al 90):");
            const num = parseInt(numStr);
            if (isNaN(num) || num < 1 || num > 90) {
                return alert("Número de bolilla inválido.");
            }
            try {
                const res = await fetch(`/api/events/${eventId}/draw-number`, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ number_called: num }) 
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                ingresarPorCorreo();
            } catch (err) {
                alert("Error al cantar bolilla: " + err.message);
            }
        }

        async function toggleSorteoAutomatico(eventId) {
            if (sortenosAutomaticos[eventId]) {
                clearInterval(sortenosAutomaticos[eventId]);
                sortenosAutomaticos[eventId] = null;
                alert("Sorteo automático detenido");
            } else {
                alert("Sorteo automático iniciado (cada 4s)");
                sortenosAutomaticos[eventId] = setInterval(async () => {
                    const num = Math.floor(Math.random() * 90) + 1;
                    await fetch(`/api/events/${eventId}/draw-number`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ number_called: num }) });
                }, 4000);
            }
        }

        function toggleTablaVentas(eventId) {
            const tabla = document.getElementById(`tablaVentas_${eventId}`);
            if (tabla.style.display === 'none' || tabla.style.display === '') {
                tabla.style.display = 'table';
            } else {
                tabla.style.display = 'none';
            }
        }

        async function renderizarEventos(events, backgroundRefresh = false) {
            const container = document.getElementById('eventsContainer');
            // Si es un refresco de fondo, evitamos recrear todo si el usuario está tipeando
            if (!backgroundRefresh) container.innerHTML = '';

            let htmlTemp = '';
            for (let ev of events) {
                const [cardsRes, drawnRes, winRes] = await Promise.all([
                    fetch(`/api/events/${ev.id}/cards`), 
                    fetch(`/api/events/${ev.id}/drawn-numbers`),
                    fetch(`/api/events/${ev.id}/winners`)
                ]);
                const cards = (await cardsRes.json()).cards || [];
                const drawn = (await drawnRes.json()).drawnNumbers || [];
                const winData = await winRes.json();
                const ganadores = winData.winners || [];

                let alertaGanadorHtml = '';
                if (ganadores.length > 0) {
                    alertaGanadorHtml = `<div class="winner-alert">🎉 ¡HAY BINGO! Ganador: Cartón #${ganadores[0].card_number} (${ganadores[0].buyer_email || 'Sin correo'})</div>`;
                }

                htmlTemp += `
                    <div class="card" id="eventCard_${ev.id}">
                        ${alertaGanadorHtml}
                        <h3>📌 ${ev.title}</h3>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div>
                                <h4>💰 Venta Manual</h4>
                                <input type="number" id="manCard_${ev.id}" placeholder="Nº Cartón">
                                <input type="text" id="manName_${ev.id}" placeholder="Nombre">
                                <input type="text" id="manEmail_${ev.id}" placeholder="Email">
                                <input type="text" id="manDni_${ev.id}" placeholder="DNI">
                                <input type="text" id="manAlias_${ev.id}" placeholder="Alias">
                                <button onclick="venderCartonManual('${ev.id}')" class="btn-emerald">Vender ✅</button>
                            </div>
                            <div>
                                <h4>📺 Configuración Multimedia (YouTube Embed)</h4>
                                <input type="text" id="stream_${ev.id}" value="${ev.stream_url||''}" placeholder="Ej: https://www.youtube.com/embed/VIDEO_ID">
                                <button onclick="fetch('/api/events/${ev.id}/stream', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({stream_url:document.getElementById('stream_${ev.id}').value})}).then(()=>alert('Stream guardado'))">Guardar Stream</button>
                                <div style="margin-top:15px; display: flex; flex-wrap: wrap; gap: 8px;">
                                    <button onclick="toggleSorteoAutomatico('${ev.id}')" class="btn-purple">⚡ Sorteo Auto</button>
                                    <button onclick="cantarBolillaManual('${ev.id}')" class="btn-blue">✋ Sorteo Manual</button>
                                    <button onclick="toggleTablaVentas('${ev.id}')" style="background-color: #d97706;">📋 Ver Ventas / Compradores</button>
                                    <button onclick="fetch('/api/events/${ev.id}', {method:'DELETE'}).then(() => ingresarPorCorreo())" class="btn-danger">Eliminar Evento</button>
                                </div>
                            </div>
                        </div>
                        <div class="ball-grid">${Array.from({length:90},(_,i)=>i+1).map(i=>`<div class="ball ${drawn.includes(i)?'called':''}">${i}</div>`).join('')}</div>
                        
                        <table class="cards-table" id="tablaVentas_${ev.id}">
                            <thead>
                                <tr style="background:#1e293b;">
                                    <th>Cartón</th>
                                    <th>Estado</th>
                                    <th>Comprador</th>
                                    <th>Correo electrónico</th>
                                    <th>DNI</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${cards.map(c=>`<tr><td>#${c.card_number}</td><td>${c.status}</td><td>${c.buyer_name||'-'}</td><td>${c.buyer_email||'-'}</td><td>${c.buyer_dni||'-'}</td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }
            container.innerHTML = htmlTemp;
        }
    </script>
</body>
</html>
