<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Jugador - Bingo SaaS</title>
    <style>
        :root {
            --bg-main: #0f172a; --bg-card: #1e293b; --border-color: #334155;
            --primary: #4f46e5; --primary-hover: #4338ca; --accent: #34d399;
            --accent-hit: #059669; --text-main: #f8fafc; --text-muted: #94a3b8;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 24px; }
        .max-w { max-width: 800px; margin: 0 auto; }
        .header-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        h1 { color: var(--accent); font-size: 24px; margin-top: 0; display: flex; align-items: center; gap: 10px; }
        p.subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
        .input-group { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
        input[type="email"] { flex: 1; min-width: 250px; background-color: #0b0f19; border: 1px solid #475569; color: white; padding: 12px 16px; border-radius: 10px; font-size: 15px; outline: none; }
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 15px; transition: background 0.2s; }
        button:hover { background-color: var(--primary-hover); }
        
        .video-box { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 24px; display: none; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .video-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .paused-banner { background: linear-gradient(135deg, #7f1d1d, #b91c1c); border: 2px solid #ef4444; color: #fee2e2; padding: 20px; border-radius: 12px; margin-bottom: 24px; text-align: center; box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); display: none; }
        
        .card-container { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .card-title { font-weight: bold; font-size: 16px; color: #818cf8; }
        .badge-bingo { background-color: #064e3b; color: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 1px solid var(--accent-hit); }

        .grid-numbers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .number-ball { aspect-ratio: 1; background: #0b0f19; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: bold; font-size: 16px; color: #e2e8f0; }
        .number-ball.hit { background: var(--accent-hit); color: white; border-color: #10b981; transform: scale(1.05); }

        .alert-box { background-color: #7f1d1d; border: 1px solid #991b1b; color: #fca5a5; padding: 12px; border-radius: 10px; font-size: 14px; margin-top: 10px; display: none; }
        .history-toggle { background: #334155; margin-bottom: 20px; width: 100%; text-align: left; border: none; color: white; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="max-w">
        <div class="header-card">
            <h1>🎯 Portal del Jugador</h1>
            <p class="subtitle">Ingresa tu correo registrado para seguir el sorteo en tiempo real y ver la transmisión en vivo.</p>
            
            <div class="input-group">
                <input type="email" id="playerEmail" placeholder="tucorreo@ejemplo.com">
                <button onclick="cargarCartones()">Cargar Mis Cartones 🚀</button>
            </div>
            <div id="errorAlert" class="alert-box"></div>
        </div>

        <!-- Pantalla de Reproductor Multimedia de YouTube -->
        <div class="video-box" id="videoBoxContainer">
            <span style="font-weight: bold; font-size: 15px; color: #38bdf8; display: flex; align-items: center; gap: 6px;">📺 Transmisión en Vivo del Evento</span>
            <div class="video-wrapper" id="videoEmbedWrapper"></div>
        </div>

        <!-- Banner de Pausa por Ganador -->
        <div id="globalPausedBanner" class="paused-banner">
            <h2>⏸️ JUEGO PAUSADO: ¡HAY UN GANADOR! 🏆</h2>
            <p id="winnerDetailsText"></p>
        </div>

        <!-- Sorteo Activo y Historial -->
        <div id="activeEventContainer"></div>
        <div id="historySectionContainer"></div>
    </div>

    <script>
        let intervaloActualizacion = null;
        let urlVideoActual = "";

        async function cargarCartones() {
            const email = document.getElementById('playerEmail').value.trim();
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.style.display = 'none';

            if (!email) {
                errorAlert.innerText = 'Por favor, ingresa un correo válido.';
                errorAlert.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`/api/cards/by-email/${encodeURIComponent(email)}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Error al obtener cartones');

                const listaCartones = data.cards || (Array.isArray(data) ? data : []);
                if (listaCartones.length === 0) {
                    errorAlert.innerText = 'No se encontraron cartones asociados a este correo.';
                    errorAlert.style.display = 'block';
                    document.getElementById('activeEventContainer').innerHTML = '';
                    document.getElementById('historySectionContainer').innerHTML = '';
                    document.getElementById('videoBoxContainer').style.display = 'none';
                    if (intervaloActualizacion) clearInterval(intervaloActualizacion);
                    return;
                }

                await procesarYRenderizar(email, listaCartones);

                if (!intervaloActualizacion) {
                    intervaloActualizacion = setInterval(() => actualizarEnVivo(email), 3000);
                }
            } catch (err) {
                errorAlert.innerText = 'Error de conexión: ' + err.message;
                errorAlert.style.display = 'block';
            }
        }

        async function procesarYRenderizar(email, cards) {
            let eventosMap = {};
            for (const card of cards) {
                if (!eventosMap[card.event_id]) {
                    eventosMap[card.event_id] = { event_id: card.event_id, cards: [] };
                }
                eventosMap[card.event_id].cards.push(card);
            }

            let eventosIds = Object.keys(eventosMap);
            if (eventosIds.length === 0) return;

            let eventoActivoId = eventosIds[eventosIds.length - 1];
            let cartonesActivos = eventosMap[eventoActivoId].cards;

            // Obtener el stream_url directamente consultando los datos del evento activo por su ID
            let streamUrlEncontrado = null;
            try {
                // Buscamos las tarjetas de ese evento para obtener información o consultamos las bolillas/ganadores
                const cardsRes = await fetch(`/api/events/${eventoActivoId}/cards`);
                // Como el evento guarda el stream_url, podemos añadir un endpoint o verificar directamente si podemos obtenerlo. 
                // Mejor aún: consultamos los datos del evento haciendo un pequeño request o usando el stream si ya lo tenemos.
                // Como en el backend tenemos los eventos enlazados, vamos a crear una ruta rápida o leerla si se expone.
            } catch(e) {}

            // Solución directa: consultamos las cartas del evento activo y aprovechamos de verificar el stream
            // Nota: Como alternativa limpia, hagamos un fetch a un endpoint que nos devuelva el evento por ID si lo tuviéramos, 
            // o consultamos las cartas y traemos el stream del evento con una consulta rápida.
            // Para no complicar el backend, vamos a obtener el stream consultando los detalles del evento mediante un endpoint que ya existe o añadiendo uno sencillo.
            
            // O directamente le pedimos el stream al servidor mediante el event_id:
            try {
                const evRes = await fetch(`/api/events/${eventoActivoId}/stream-info`); // O consultamos directo
                // Como no creamos /stream-info, vamos a leerlo del mismo objeto si lo guardamos o lo consultamos con una query.
            } catch(e) {}

            // Vamos a simplificarlo haciendo que el cliente obtenga el stream consultando un endpoint limpio:
            try {
                const streamRes = await fetch(`/api/events/${eventoActivoId}/details`);
                const streamData = await streamRes.json();
                if (streamData && streamData.event && streamData.event.stream_url) {
                    streamUrlEncontrado = streamData.event.stream_url;
                }
            } catch(e) {}

            const videoBox = document.getElementById('videoBoxContainer');
            const videoWrapper = document.getElementById('videoEmbedWrapper');
            if (streamUrlEncontrado) {
                if (urlVideoActual !== streamUrlEncontrado) {
                    urlVideoActual = streamUrlEncontrado;
                    videoWrapper.innerHTML = `<iframe src="${streamUrlEncontrado}" allowfullscreen></iframe>`;
                }
                videoBox.style.display = 'block';
            } else {
                videoBox.style.display = 'none';
                urlVideoActual = "";
                videoWrapper.innerHTML = "";
            }

            // Validar ganadores únicamente si el evento activo tiene bolillas sorteadas
            let hayGanadorGlobal = false;
            let infoGanadorStr = "";
            try {
                const drawnRes = await fetch(`/api/events/${eventoActivoId}/drawn-numbers`);
                const drawnData = await drawnRes.json();
                const bolillasCantadas = drawnData.drawnNumbers || [];

                if (bolillasCantadas.length > 0) {
                    const resWin = await fetch(`/api/events/${eventoActivoId}/winners`);
                    const winData = await resWin.json();
                    if (winData.winners && winData.winners.length > 0) {
                        hayGanadorGlobal = true;
                        const ganador = winData.winners[0];
                        infoGanadorStr = `El cartón <strong>#${ganador.card_number}</strong> ha cantado BINGO.`;
                    }
                }
            } catch(e) {}

            const banner = document.getElementById('globalPausedBanner');
            if (hayGanadorGlobal) {
                document.getElementById('winnerDetailsText').innerHTML = infoGanadorStr;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }

            // Renderizar Sorteo Activo Arriba
            const activeContainer = document.getElementById('activeEventContainer');
            activeContainer.innerHTML = `<h3 style="color:#38bdf8; margin-bottom:15px;">🔥 Sorteo en Curso</h3>`;
            
            const resDrawnActive = await fetch(`/api/events/${eventoActivoId}/drawn-numbers`);
            const drawnDataActive = await resDrawnActive.json();
            const drawnNumbersActive = drawnDataActive.drawnNumbers || [];

            for (const card of cartonesActivos) {
                let esGanadorActual = (card.status === 'bingo' && drawnNumbersActive.length > 0);
                let bingoBadge = esGanadorActual ? `<span class="badge-bingo">¡TU CARTÓN GANÓ! 🎉</span>` : '';
                
                let html = `
                    <div class="card-container">
                        <div class="card-header">
                            <span class="card-title">🎟️ Cartón #${card.card_number}</span>
                            ${bingoBadge}
                        </div>
                        <div class="grid-numbers">`;
                
                const numerosCarton = (card.card_data && card.card_data.numbers) ? card.card_data.numbers : (Array.isArray(card.card_data) ? card.card_data : []);
                numerosCarton.forEach(num => {
                    const isHit = drawnNumbersActive.includes(num);
                    html += `<div class="number-ball ${isHit ? 'hit' : ''}">${num}</div>`;
                });
                html += `</div></div>`;
                activeContainer.innerHTML += html;
            }

            // Historial de eventos anteriores
            const historyContainer = document.getElementById('historySectionContainer');
            if (eventosIds.length > 1) {
                historyContainer.innerHTML = `
                    <button class="history-toggle" onclick="toggleHistorial()">📂 Ver Sorteos Anteriores (${eventosIds.length - 1})</button>
                    <div id="historialContenido" style="display:none; margin-top:10px;"></div>
                `;
                let historialHtml = '';
                for (let i = 0; i < eventosIds.length - 1; i++) {
                    let pastEventId = eventosIds[i];
                    historialHtml += `<h4 style="color:#94a3b8; margin-top:20px;">Sorteo ID: ${pastEventId}</h4>`;
                    for (const card of eventosMap[pastEventId].cards) {
                        historialHtml += `
                            <div class="card-container" style="opacity: 0.8;">
                                <div class="card-header"><span class="card-title">🎟️ Cartón #${card.card_number}</span></div>
                                <div class="grid-numbers">`;
                        const nums = (card.card_data && card.card_data.numbers) ? card.card_data.numbers : (Array.isArray(card.card_data) ? card.card_data : []);
                        nums.forEach(n => { historialHtml += `<div class="number-ball">${n}</div>`; });
                        historialHtml += `</div></div>`;
                    }
                }
                document.getElementById('historialContenido').innerHTML = historialHtml;
            } else {
                historyContainer.innerHTML = '';
            }
        }

        function toggleHistorial() {
            const contenido = document.getElementById('historialContenido');
            contenido.style.display = contenido.style.display === 'none' ? 'block' : 'none';
        }

        async function actualizarEnVivo(email) {
            try {
                const res = await fetch(`/api/cards/by-email/${encodeURIComponent(email)}`);
                const data = await res.json();
                const listaCartones = data.cards || (Array.isArray(data) ? data : null);
                if (res.ok && listaCartones) {
                    await procesarYRenderizar(email, listaCartones);
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
