<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Jugador - Bingo SaaS</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #34d399;
            --accent-hit: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
        }

        .max-w { max-width: 800px; margin: 0 auto; }

        .header-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        h1 { color: var(--accent); font-size: 24px; margin-top: 0; display: flex; align-items: center; gap: 10px; }
        p.subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }

        .input-group { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }

        input[type="email"] {
            flex: 1; min-width: 250px;
            background-color: #0b0f19; border: 1px solid #475569;
            color: white; padding: 12px 16px; border-radius: 10px; font-size: 15px; outline: none;
        }

        button {
            background-color: var(--primary); color: white; border: none;
            padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 15px;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }

        /* Contenedor de Reproductor Multimedia / Video */
        .video-box {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 16px; margin-bottom: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: none;
        }
        .video-wrapper {
            position: relative; width: 100%; padding-top: 56.25%;
            background: #000; border-radius: 10px; overflow: hidden; margin-top: 10px;
        }
        .video-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        /* Barra de Música Interactiva */
        .music-bar {
            background: #0b0f19; border: 1px solid var(--border-color);
            padding: 12px 16px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted);
            flex-wrap: wrap; gap: 10px;
        }
        .btn-music {
            background-color: #059669; padding: 6px 12px; font-size: 13px; border-radius: 6px; border: none; color: white; cursor: pointer;
        }
        .btn-music:hover { background-color: #047857; }

        /* Banner de Pausa por Ganador */
        .paused-banner {
            background: linear-gradient(135deg, #7f1d1d, #b91c1c);
            border: 2px solid #ef4444; color: #fee2e2;
            padding: 20px; border-radius: 12px; margin-bottom: 24px; text-align: center;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            animation: pulseBanner 2s infinite;
        }
        .paused-banner h2 { margin: 0 0 8px 0; font-size: 20px; color: #fff; }
        .paused-banner p { margin: 0; font-size: 15px; }

        .card-container {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 20px; margin-bottom: 20px;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
        }
        .card-title { font-weight: bold; font-size: 16px; color: #818cf8; }
        .badge-bingo {
            background-color: #064e3b; color: var(--accent); padding: 4px 10px;
            border-radius: 20px; font-size: 12px; font-weight: bold; border: 1px solid var(--accent-hit);
        }

        .grid-numbers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .number-ball {
            aspect-ratio: 1; background: #0b0f19; border: 1px solid #334155;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-weight: bold; font-size: 16px; color: #e2e8f0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .number-ball.hit {
            background: var(--accent-hit); color: white; border-color: #10b981;
            transform: scale(1.05); box-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
        }

        .alert-box {
            background-color: #7f1d1d; border: 1px solid #991b1b; color: #fca5a5;
            padding: 12px; border-radius: 10px; font-size: 14px; margin-top: 15px; display: none;
        }

        @keyframes pulseBanner {
            0% { transform: scale(1); }
            50% { transform: scale(1.01); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="max-w">
        <!-- Panel de Identificación -->
        <div class="header-card">
            <h1>🎯 Portal del Jugador</h1>
            <p class="subtitle">Ingresa tu correo registrado para seguir el sorteo en tiempo real y ver el contenido multimedia del evento.</p>
            
            <div class="input-group">
                <input type="email" id="playerEmail" placeholder="tucorreo@ejemplo.com">
                <button onclick="cargarCartones()">Cargar Mis Cartones 🚀</button>
            </div>
            
            <!-- Barra de Música Interactiva -->
            <div class="music-bar">
                <span>🎵 Música Ambiental Instrumental (Lo-Fi):</span>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button class="btn-music" onclick="toggleMusica()" id="btnMusicText">▶ Reproducir Música</button>
                    <audio id="bgMusic" loop>
                        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
                    </audio>
                </div>
            </div>

            <div id="errorAlert" class="alert-box"></div>
        </div>

        <!-- Pantalla de Reproductor Multimedia / Video Estático -->
        <div class="video-box" id="videoBoxContainer">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: bold; font-size: 14px; color: #38bdf8; display: flex; align-items: center; gap: 6px;">
                    📺 Reproductor Multimedia del Evento
                </span>
                <span style="font-size: 11px; background: #0369a1; color: #e0f2fe; padding: 2px 8px; border-radius: 4px; font-weight: bold;">MULTIMEDIA</span>
            </div>
            <div class="video-wrapper" id="videoEmbedWrapper">
                <!-- El iframe se inyecta UNA SOLA VEZ aquí para evitar que se reinicie -->
            </div>
        </div>

        <!-- Banner de Pausa Global por Ganador -->
        <div id="globalPausedBanner" style="display: none;" class="paused-banner">
            <h2>⏸️ JUEGO PAUSADO: ¡HAY UN GANADOR! 🏆</h2>
            <p id="winnerDetailsText">Verificando información del ganador...</p>
        </div>

        <!-- Contenedor Dinámico de Cartones -->
        <div id="cardsContainer"></div>
    </div>

    <script>
        let intervaloActualizacion = null;
        let reproduciendo = false;
        let urlVideoActual = ""; // Variable para recordar el video activo y no recrearlo

        function toggleMusica() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('btnMusicText');
            
            if (reproduciendo) {
                music.pause();
                btn.innerText = "▶ Reproducir Música";
                reproduciendo = false;
            } else {
                music.play().then(() => {
                    btn.innerText = "⏸ Pausar Música";
                    reproduciendo = true;
                }).catch(e => {
                    alert("El navegador bloqueó la reproducción automática. Haz clic de nuevo.");
                });
            }
        }

        async function cargarCartones() {
            const email = document.getElementById('playerEmail').value.trim();
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.style.display = 'none';

            if (!email) {
                errorAlert.innerText = 'Por favor, ingresa un correo válido.';
                errorAlert.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`/api/cards/by-email/${encodeURIComponent(email)}`);
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error || 'Error al obtener cartones');

                if (!data.cards || data.cards.length === 0) {
                    errorAlert.innerText = 'No se encontraron cartones asociados a este correo.';
                    errorAlert.style.display = 'block';
                    document.getElementById('cardsContainer').innerHTML = '';
                    document.getElementById('videoBoxContainer').style.display = 'none';
                    if (intervaloActualizacion) clearInterval(intervaloActualizacion);
                    return;
                }

                // Cargar video multimedia por primera vez (si existe)
                inicializarVideoMultimedia(data.cards);

                await verificarYRenderizar(email, data.cards);

                if (!intervaloActualizacion) {
                    intervaloActualizacion = setInterval(() => actualizarEnVivo(email), 3000);
                }

            } catch (err) {
                errorAlert.innerText = 'Error de conexión: ' + err.message;
                errorAlert.style.display = 'block';
            }
        }

        function inicializarVideoMultimedia(cards) {
            let streamUrlEncontrado = null;
            for (const card of cards) {
                if (card.stream_url) {
                    streamUrlEncontrado = card.stream_url;
                    break;
                }
            }

            const videoBox = document.getElementById('videoBoxContainer');
            const videoWrapper = document.getElementById('videoEmbedWrapper');

            if (streamUrlEncontrado) {
                // Solo si el enlace es diferente al que ya se está reproduciendo, lo insertamos
                if (urlVideoActual !== streamUrlEncontrado) {
                    urlVideoActual = streamUrlEncontrado;
                    videoWrapper.innerHTML = `<iframe src="${streamUrlEncontrado}" allowfullscreen></iframe>`;
                }
                videoBox.style.display = 'block';
            } else {
                videoBox.style.display = 'none';
                urlVideoActual = "";
            }
        }

        async function verificarYRenderizar(email, cards) {
            let hayGanadorGlobal = false;
            let infoGanadorStr = "";

            for (const card of cards) {
                try {
                    const resWin = await fetch(`/api/events/${card.event_id}/winners`);
                    const winData = await resWin.json();
                    if (winData.winners && winData.winners.length > 0) {
                        hayGanadorGlobal = true;
                        const ganador = winData.winners[0];
                        infoGanadorStr = `El cartón <strong>#${ganador.card_number}</strong> perteneciente a <strong>${ganador.buyer_email}</strong> ha cantado BINGO.`;
                        break;
                    }
                } catch(e) {}
            }

            // Gestionar banner de pausa por ganador
            const banner = document.getElementById('globalPausedBanner');
            if (hayGanadorGlobal) {
                document.getElementById('winnerDetailsText').innerHTML = infoGanadorStr;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }

            renderizarCartonesVisuales(cards);
        }

        async function renderizarCartonesVisuales(cards) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            for (const card of cards) {
                const resDrawn = await fetch(`/api/events/${card.event_id}/drawn-numbers`);
                const drawnData = await resDrawn.json();
                const drawnNumbers = drawnData.drawnNumbers || [];

                let bingoBadge = card.status === 'bingo' ? `<span class="badge-bingo">¡TU CARTÓN GANÓ! 🎉</span>` : '';

                let html = `
                    <div class="card-container">
                        <div class="card-header">
                            <span class="card-title">🎟️ Cartón #${card.card_number}</span>
                            ${bingoBadge}
                        </div>
                        <div class="grid-numbers">`;

                card.card_data.numbers.forEach(num => {
                    const isHit = drawnNumbers.includes(num);
                    html += `<div class="number-ball ${isHit ? 'hit' : ''}">${num}</div>`;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            }
        }

        async function actualizarEnVivo(email) {
            try {
                const res = await fetch(`/api/cards/by-email/${encodeURIComponent(email)}`);
                const data = await res.json();
                if (res.ok && data.cards) {
                    // Actualizamos únicamente la verificación de ganadores y los cartones sin tocar el video
                    await verificarYRenderizar(email, data.cards);
                }
            } catch (e) {
                console.error("Error en sincronización:", e);
            }
        }
    </script>
</body>
</html>
